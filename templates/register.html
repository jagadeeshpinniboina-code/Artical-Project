{% extends 'base.html' %}

{% load crispy_forms_filters %}

{% block title %}
	Register-page
{% endblock %}

{% block body %}
	{% if form %}
        <form method="POST" class="post-section" id="login-form">
           {% csrf_token %}
            <h1 class="text-center text-danger">Register Now</h1>
            <hr>
            {{ form|crispy }}
            <div>
                <input type="submit" class="btn btn-primary">
            </div>
        </form>

    {% else %}
        <h1>registration not found</h1>

    {% endif %}
{% endblock %}
